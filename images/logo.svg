<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8e2de2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a00e0;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="15" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Shield/Badge Background -->
  <path d="M250 50 L450 120 V250 C450 380 370 450 250 480 C130 450 50 380 50 250 V120 Z" 
        fill="none" stroke="url(#grad1)" stroke-width="15" filter="url(#glow)"/>
        
  <!-- Letter A -->
  <text x="50%" y="55%" dominant-baseline="middle" text-anchor="middle" 
        font-family="Arial, sans-serif" font-weight="bold" font-size="280" fill="#ffffff" filter="url(#glow)">
    A
  </text>
  
  <!-- Circuit Nodes (Cyber Touch) -->
  <circle cx="250" cy="50" r="10" fill="#00ff00" filter="url(#glow)"/>
  <circle cx="450" cy="120" r="10" fill="#00ff00" filter="url(#glow)"/>
  <circle cx="50" cy="120" r="10" fill="#00ff00" filter="url(#glow)"/>
  <circle cx="250" cy="480" r="10" fill="#00ff00" filter="url(#glow)"/>
  
  <path d="M250 50 L250 100 M450 120 L400 150 M50 120 L100 150" stroke="#00ff00" stroke-width="4" stroke-opacity="0.7"/>

</svg>
